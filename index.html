<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ムニ助電卓</title>
  <meta name="description" content="時計付きのシンプルな電卓アプリ">
  <meta name="theme-color" content="#1c1c22">

  <!-- iPad / iPhone のホーム画面用 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ムニ助電卓">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="clock" aria-label="現在の時刻">
      <img class="munisuke" id="munisuke" src="images/munisuke.png" alt="ムニスケ" draggable="false">
      <div class="clock-text">
        <div class="clock-date" id="clock-date">&nbsp;</div>
        <div class="clock-time" id="clock-time">--:--<span class="sec">:--</span></div>
      </div>
    </section>

    <section class="calc" aria-label="電卓">
      <div class="display">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="result" id="result" aria-live="polite">0</div>
      </div>

      <div class="keys">
        <button class="key fn" data-action="clear" id="clear-key">AC</button>
        <button class="key fn" data-action="sign">±</button>
        <button class="key fn" data-action="percent">%</button>
        <button class="key op" data-op="/">÷</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key op" data-op="*">×</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key op" data-op="-">−</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key op" data-op="+">+</button>

        <button class="key zero" data-digit="0">0</button>
        <button class="key" data-action="dot">.</button>
        <button class="key eq" data-action="equals">=</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
